<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyasa Gita — Grid View</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif', serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
            line-height: 1.6;
            color: #333;
            background-color: #fdfdfd;
        }

        /* Generic Vyasa Semantic Classes */
        .devanagari {
            font-size: 1.25rem;
            text-align: center;
            color: #b22222;
            margin: 1.5rem 0;
            line-height: 1.8;
        }

        .iast {
            font-size: 1.1rem;
            text-align: center;
            font-style: italic;
            margin: 1.5rem 0;
        }

        .synonyms {
            font-size: 0.95rem;
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f9f9f9;
            border-left: 4px solid #ccc;
        }

        .translation {
            font-weight: bold;
            font-size: 1.1rem;
            margin: 1.5rem 0;
        }

        .purport {
            margin: 1.5rem 0;
            text-align: justify;
        }

        .verse {
            font-size: 1.1rem;
            text-align: center;
            margin: 1.5rem 0;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .speaker, .action, .uvaca {
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 0.05em;
            color: #b22222;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* 3-Column URN Row & Gutters */
        .urn-row {
            display: grid;
            grid-template-columns: 80px 1fr 200px;
            gap: 1.5rem;
            align-items: baseline;
            padding: 1.5rem 0;
            border-bottom: 1px solid #eee;
        }
        @media (max-width: 768px) {
            .urn-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
        }
        .left-gutter {
            position: sticky;
            top: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .urn-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            background: #f4f4f4;
            color: #555;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .urn-badge:hover {
            background: #e0e0e0;
            color: #000;
        }
        .urn-content {
            min-width: 0;
        }
        .urn-content > *:first-child {
            margin-top: 0 !important;
        }
        .urn-content > *:last-child {
            margin-bottom: 0 !important;
        }
        .right-gutter {
            position: sticky;
            top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.85rem;
        }
        .speaker-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.65rem;
            background: #fff5f5;
            color: #b22222;
            border: 1px solid #fbd0d0;
            border-radius: 6px;
            font-weight: 600;
            line-height: 1.3;
        }
        .note-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: #fdfaf0;
            color: #856404;
            border: 1px solid #ffeeba;
            border-radius: 50%;
            cursor: help;
        }
    </style>
</head>

<body>
    <div class="content">
        {{ body }}
    </div>
</body>

</html>
